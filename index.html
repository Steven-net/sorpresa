<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feliz Cumpleaños</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="particles" id="particles"></div>

    <header class="hero">
      <div class="hero-inner">
        <p class="hero-label">con todo el cariño del mundo</p>
        <h1 class="hero-title" id="hero-title">
          Feliz Cumpleaños,<br /><span id="hero-name">Nicole</span>
        </h1>
        <p class="hero-date">19 de mayo de 2026</p>
        <div class="hero-divider">
          <span></span><span class="diamond">◆</span><span></span>
        </div>
        <p class="hero-count" id="hero-count">0 personas te escribieron hoy</p>
      </div>
    </header>

    <main class="cards-section">
      <div class="cards-grid" id="cards-grid"></div>
      <p class="empty-state" id="empty-state">
        Aún no hay mensajes.<br />¡Agrega el primero con el botón de arriba!
      </p>
    </main>

    <footer class="site-footer">
      <p>
        Hecho con amor &nbsp;◆&nbsp;
        <span id="footer-name">Tus seres queridos</span>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
